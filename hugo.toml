baseURL = "https://babyshark33.netlify.app/"
DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
languageCode = "en"
title = "Lightbi"
theme = "lightbi-hugo"
summaryLength  = "30"
metaDataFormat = "yaml"
hasCJKLanguage = true
pygmentsStyle = "trac"
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClassic = true
pygmentOptions = "linenos=inline"
#googleAnalytics = "XXX"
enableRobotsTXT = true
enableGitInfo = false
ignoreLogs = ['warning-goldmark-raw-html']

[Params]
selfHosted = true
mainSections = ["post","posts"]
#dateFormat = "02 January 2006"
comments = false
readingTime = true
wordCount = true
hideAuthor = false
useHLJS = true
socialShare = true
delayDisqus = true
showRelatedPosts = true 
gcse = false
Lastmod = false
rss = true 
pagination = "10"
description="Your can add your website description here."
lunrSearch = true
previewCardImagePlacement = "bottom"
showPostImage = false

[pagination]
pagerSize = 6

[languages]
  [languages.en]
    LanguageCode  = "en"
    LanguageName = "English"
    weight = 1
    title = "Baby Shark Blog"
    contentDir = "content/en"
    [languages.en.params]
      dateFormat = "02 January 2006"

  [languages.zh-cn]
    LanguageCode  = "zh-CN"
    LanguageName = "中文"
    weight = 2
    title = "Baby Shark Blog"
    contentDir = "content/zh-cn"

[Params.Author]
  name = "33"
  website = ""
  authorInfo = "Give everything for your dreams."
  authorPostImage = "/img/author-post-img.jpg"
